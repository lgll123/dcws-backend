<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
</head>
<style>
    @page {
      size: A4;          /* 固定为A4尺寸 */
      margin: 20mm;      /* 设置页边距（可选） */
    }

    html,
    body {
      font-family: SourceHanSansCN, Microsoft YaHei, Helvetica Neue, Helvetica, PingFang SC, Arial, "sans-serif";
      color: #000;
      /*width: 210mm;
      margin: 0 auto;
      padding: 0 36px;*/
      font-weight: 600;
       width: 210mm;      /* A4宽度 210mm ≈ 8.27英寸 */
        height: 297mm;     /* A4高度 297mm ≈ 11.69英寸 */
        margin: 10px;    /* 内容居中 */
        box-sizing: border-box;
    }
    .pdf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      /*padding-top: 10px;*/
      padding: 0px 0 30px 0px;
    }
    .basic-info table {
      width: 100%;
      font-size: 9px;
      padding-left: 43px;
      margin-top: 10px;
      border-collapse: collapse;
      border: none;
    }
    .basic-info table th,
    .basic-info table td {
      text-align: left;
    }
    .basic-info table .heavy-text th {
      /* font-weight: 500; */
    }
    .basic-info .light-text td {
      padding: 5px 0 10px 0;
      font-weight: 400;
    }
    /*.title-divider {
      border-bottom: 1px solid #000;
    }*/
    .title-divider th {
      /*padding-bottom: 10px;*/
      border-bottom: 1px solid #000;
    }
    .apply-info .light-text td,
    .clear-info .light-text td {
      padding-top: 8px;
    }
    .apply-info table th,
    .clear-info table th {
      font-weight: 400!important;
    }
    .flow-chat .process-line .process-line__item {
      position: relative;
      display: block;
      padding-bottom: 20px;
      font-size: 8px;
      font-weight: 400;
    }

    /* 时间轴容器
    .flow-chat {
        list-style: none;
        padding-left: 0;
    }*/

    .flow-chat .line {
      position: absolute;
      top: 5px;
      left: -15px;
      width: 2px;
      height: 100%;
      background-color: #666;
    }
    .flow-chat .circle-container {
      position: absolute;
      top: 5px;
      left: -14px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      z-index: 1;
      line-height: 1;
      transform: translate(-50%, -50%);
      background-color: #666;
    }
    .flow-chat .status-tag {
      color: #333;
      background-color: #e9e9e9;
      padding: 2px;
    }
    .flow-chat .process-line .process-line__item:last-child .line {
      height: 0;
    }
</style>
<body>
<!-- pdf头部 -->
<div class="pdf-header" >
    <div class="left">
        <span style="font-size: 18px; margin-right: 16px;">申请用印清单</span>
        <span style="font-size: 9px; " th:text="${data.id}"></span>
    </div>
    <img src="./seal.png" alt="" width="80">
</div>
<!-- 基础信息 -->
<div class="basic-info">
    <div style="font-size: 10px;">基础信息</div>
    <div style="padding-left: 43px">
        <table class="table-right-align">
            <tr class="heavy-text">
                <th>申请部门</th>
                <th>申请人</th>
                <th>申请日期</th>
                <th>当前环节</th>
            </tr>
            <tr class="light-text">
                <td th:text="${data.applyDept}"></td>
                <td th:text="${data.applicant}"></td>
                <td th:text="${#dates.format(data.applyDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${data.status}"></td>
            </tr>
            <tr class="heavy-text">
                <th>使用日期</th>
            </tr>
            <tr class="light-text">
                <td th:text="${#dates.format(data.completeDate, 'yyyy-MM-dd')}"></td>
            </tr>
        </table>
        <div class="table-right-align" style="font-size: 9px;">
            <div>
                <span style="margin-right: 15px; display: inline-block; width: 40px;">申请内容</span><span class="light-text" th:text="${data.applyReson}" style="font-weight: 400;"></span>
            </div>
            <div style="margin-top: 10px;">
                <span style="margin-right: 15px; display: inline-block; width: 40px;">备注</span><span class="light-text" th:text="${data.applyRemarks}" style="font-weight: 400;"></span>
            </div>
        </div>
    </div>
</div>
<!-- 印章信息 -->
<div class="basic-info apply-info" style="margin-top: 20px;">
    <div style="font-size: 10px;">印章信息</div>
    <div style="padding-left: 43px">
        <table class="table-right-align" style="font-size: 9px;">
            <thead class="title-divider">
            <tr class="heavy-text">
                <th>序号</th>
                <th>公司名称</th>
                <th style="text-align: right;">印章名称</th>
                <th style="text-align: right;">份数</th>
                <th style="text-align: right;">用印文件</th>
            </tr>
            </thead>
            <tbody class="light-text">
                <tr th:each="item : ${data.applyDetails}">
                    <td th:text="${item.num}"></td>
                    <td th:text="${item.companyName}"></td>
                    <td style="text-align: right;">
                    <span th:each="info : ${item.sealInfoList}">
                        <span th:text="${info.sealName}"></span><br>
                    </span>
                    </td>
                    <td th:text="${item.applyNum}" style="text-align: right;">份</td>
                    <td style="text-align: right;">
                    <span th:each="file : ${item.sealFile}">
                        <span th:text="${file.fileName}"></span><br>
                    </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<!-- 审批记录 -->
<div class="flow-chat" style="margin-top: 20px;">
    <div style="font-size: 10px; margin-bottom: 12px">审批记录</div>
    <div class="process-line" style="padding-left: 58px;"  th:each="record : ${data.historyRecords}" >

        <div class="process-line__item">
            <div class="title">
                <div class="info">
                    <div>
                        <span style="font-size: 9px; margin-right: 12px;" th:text="${#dates.format(record.endTime, 'yyyy-MM-dd HH:mm:ss')}"></span>
                        <span class="status-tag" style="margin-right: 12px;" th:text="${record.name}"></span>
                        <span class="status-tag" th:text="${record.statusName}"></span>
                    </div>
                    <div style="margin-top: 7px;">
                        <span class="label">处理人：</span>
                        <span class="value" th:text="${record.nickName}"></span>
                    </div>
                    <div class="comment" style="margin-top: 7px;">
                        <span class="label">审批意见：</span>
                        <span class="value" th:text="${record.comment}"></span>
                    </div>
                </div>
            </div>
            <div class="circle-container"></div>
            <div class="line"> </div>
        </div>
      </div>
    </div>
</body>
</html>

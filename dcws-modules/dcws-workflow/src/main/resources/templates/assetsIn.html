<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
</head>
<style>
    @page {
      size: A4;          /* 固定为A4尺寸 */
      margin: 20mm;      /* 设置页边距（可选） */
    }

    html,
    body {
      font-family: SourceHanSansCN, Microsoft YaHei, Helvetica Neue, Helvetica, PingFang SC, Arial, "sans-serif";
      color: #000;
      width: 595px;
      margin: 0 auto;
    }
    .basic-info table {
      width: 100%;
      padding-left: 43px;
      margin-top: 10px;
      border-collapse: collapse;
      border: none;
    }
    .basic-info table th,
    .basic-info table td {
      text-align: left;
    }
    .basic-info .light-text td {
      padding: 5px 0 10px 0;
    }
    .title-divider th {
      padding-bottom: 7px;
      border-bottom: 1px solid #000;
    }
    .table-apply-info {
      font-size: 11px;
      font-weight: 400;
    }
    .table-apply-title {
      font-size: 14px;
      font-weight: 700;
      margin-top: 10px;
    }
    .apply-info .light-text td,
    .clear-info .light-text td {
      padding-top: 8px;
    }
    .flow-chat .process-line .process-line__item {
      position: relative;
	  page-break-inside: avoid;  /*防止分页切断 */
      padding-bottom: 25px;
      padding-left: 15px;
      border-left: 2px solid #666;
      z-index: 1;
    }

    .flow-chat .circle-container {
      position: absolute;
      top: 0px;
      left: -4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      z-index: 2;
      background-color: #666;
    }
    .flow-chat .status-tag {
      color: #333;
      background-color: #e9e9e9;
      padding: 2px;
    }
    .flow-chat .process-line .process-line__item:last-child {
      border: none;
    }

    .flow-chat .process-line .process-line__item:not(:first-child) {
      margin-top: -5px;
    }

    .flow-chat .process-line .process-line__item:first-child {
        padding-bottom: 80px;
    }

    .flow-chat .process-line .process-line__item:first-child .title {
      position: absolute;
      top: -5px;
      left: 15px
    }

    .flow-chat .process-line .process-line__item:not(:first-child) .circle-container {
      top: 29px;
    }
    .flow-chat .process-line .process-line__item:last-child .circle-container {
        left: -2px;
    }
</style>
<body>
<!-- pdf头部 -->
<div class="pdf-header" style="overflow: hidden; line-height: 79px;padding-right: 43px;">
    <div class="left" style="float: left">
        <span style="font-size: 25px; margin-right: 16px;font-weight: 700;">资产入库申请单</span>
        <span style="font-size: 12px;font-weight: 200;" th:text="${data.id}"></span>
    </div>
    <img src="./seal.png" alt="" width="80" style="float: right">
    <!--<img th:src="@{/templates/seal.png}" alt="" width="80">-->
</div>
<!-- 基础信息 -->
<div class="basic-info">
    <div style="font-size: 14px;font-weight: 700;">基础信息</div>
    <div style="padding-left: 43px">
        <table>
            <tr style="font-size: 13px;font-weight: 700;">
                <th>申请部门</th>
                <th>申请人</th>
                <th>申请日期</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;">
                <td th:text="${data.applyDept}"></td>
                <td th:text="${data.applicant}"></td>
                <td th:text="${#dates.format(data.applyDate, 'yyyy-MM-dd')}"></td>
            </tr>
        </table>
        <div>
            <div style="overflow: hidden;">
                <span style="float: left;margin-right: 15px; display: inline-block; width: 60px;font-size: 13px;font-weight: 700;">申请原因</span><span class="light-text" th:text="${data.applyReson}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></span>
            </div>
            <div style="margin-top: 10px;overflow: hidden;">
                <span style="float: left;margin-right: 15px; display: inline-block; width: 60px;font-size: 13px;font-weight: 700;">备注</span><span class="light-text" th:text="${data.applyRemarks}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></span>
            </div>
        </div>
    </div>
</div>
<!-- 登记信息 -->
<div class="basic-info clear-info" style="margin-top: 20px;">
    <div  style="font-size: 14px;font-weight: 700;">登记信息</div>
    <!-- 资产清单 -->
    <div style="padding-left: 23px"  th:if="${data.hardware != null and not #lists.isEmpty(data.hardware)}">
        <div class="table-apply-title">资产清单</div>
        <table class="table-apply-info">
            <thead class="title-divider">
            <tr>
                <th>资产名称</th>
                <th style="text-align: right;">资产标签</th>
                <th style="text-align: right;">序列号</th>
                <th style="text-align: right;">型号</th>
                <th style="text-align: right;">位置</th>
                <th style="text-align: right;">采购价格</th>
                <th style="text-align: right;">供应商</th>
                <th style="text-align: right;">备注</th>
            </tr>
            </thead>
            <tbody class="light-text">
            <tr th:each="item : ${data.hardware}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.assetTag}" style="text-align: right;"></td>
                <td th:text="${item.serialNumber}" style="text-align: right;"></td>
                <td th:text="${item.modelNo}" style="text-align: right;"></td>
                <td th:text="${item.categoryName}" style="text-align: right;"></td>
                <td th:text="${item.purchaseCost}" style="text-align: right;"></td>
                <td th:text="${item.supplier}" style="text-align: right;"></td>
                <td th:text="${item.remark}" style="text-align: right;"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <!-- 许可证清单 -->
    <div style="padding-left: 23px" th:if="${data.licenses != null and not #lists.isEmpty(data.licenses)}">
        <div class="table-apply-title">许可证清单</div>
        <table class="table-apply-info">
            <thead class="title-divider">
            <tr>
                <th>名称</th>
                <th style="text-align: right;">分类名称</th>
                <th style="text-align: right;">允许使用次数</th>
                <th style="text-align: right;">产品序列号</th>
                <th style="text-align: right;">制造商</th>
                <th style="text-align: right;">许可人名字</th>
                <th style="text-align: right;">许可电子邮件</th>
                <th style="text-align: right;">到期日期</th>
                <th style="text-align: right;">备注</th>
            </tr>
            </thead>
            <tbody class="light-text">
            <tr th:each="item : ${data.licenses}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.category}" style="text-align: right;"></td>
                <td th:text="${item.seats}" style="text-align: right;"></td>
                <td th:text="${item.serial}" style="text-align: right;"></td>
                <td th:text="${item.manufacturer}" style="text-align: right;"></td>
                <td th:text="${item.licenseName}" style="text-align: right;"></td>
                <td th:text="${item.licenseEmail}" style="text-align: right;"></td>
                <td th:text="${item.expirationDate}" style="text-align: right;"></td>
                <td th:text="${item.remark}" style="text-align: right;"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <!-- 附属品清单 -->
    <div style="padding-left: 23px"  th:if="${data.accessories != null and not #lists.isEmpty(data.accessories)}">
        <div class="table-apply-title">附属品清单</div>
        <table class="table-apply-info">
            <thead class="title-divider">
            <tr>
                <th>配件名称</th>
                <th style="text-align: right;">配件类别</th>
                <th style="text-align: right;">型号</th>
                <th style="text-align: right;">位置</th>
                <th style="text-align: right;">数量</th>
                <th style="text-align: right;">采购价格</th>
                <th style="text-align: right;">购买日期</th>
                <th style="text-align: right;">供应商</th>
            </tr>
            </thead>
            <tbody class="light-text">
            <tr th:each="item : ${data.accessories}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.category}" style="text-align: right;"></td>
                <td th:text="${item.modelNumber}" style="text-align: right;"></td>
                <td th:text="${item.location}" style="text-align: right;"></td>
                <td th:text="${item.num}" style="text-align: right;"></td>
                <td th:text="${item.purchaseCost}" style="text-align: right;"></td>
                <td th:text="${item.purchaseDate}" style="text-align: right;"></td>
                <td th:text="${item.supplier}" style="text-align: right;"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <!-- 组件清单 -->
    <div style="padding-left: 23px"  th:if="${data.components != null and not #lists.isEmpty(data.components)}">
        <div class="table-apply-title">组件清单</div>
        <table class="table-apply-info">
            <thead class="title-divider">
            <tr>
                <th>名称</th>
                <th style="text-align: right;">类别</th>
                <th style="text-align: right;">数量</th>
                <th style="text-align: right;">序列号</th>
                <th style="text-align: right;">位置</th>
                <th style="text-align: right;">供应商</th>
                <th style="text-align: right;">采购价格</th>
                <th style="text-align: right;">备注</th>
            </tr>
            </thead>
            <tbody class="light-text">
            <tr th:each="item : ${data.components}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.category}" style="text-align: right;"></td>
                <td th:text="${item.num}" style="text-align: right;"></td>
                <td th:text="${item.serial}" style="text-align: right;"></td>
                <td th:text="${item.location}" style="text-align: right;"></td>
                <td th:text="${item.supplier}" style="text-align: right;"></td>
                <td th:text="${item.purchaseCost}" style="text-align: right;"></td>
                <td th:text="${item.remark}" style="text-align: right;"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <!-- 消耗品清单 -->
    <div style="padding-left: 23px"  th:if="${data.consumables != null and not #lists.isEmpty(data.consumables)}">
        <div class="table-apply-title">消耗品清单</div>
        <table class="table-apply-info">
            <thead class="title-divider">
            <tr>
                <th>名称</th>
                <th style="text-align: right;">类别</th>
                <th style="text-align: right;">型号</th>
                <th style="text-align: right;">供应商</th>
                <th style="text-align: right;">位置</th>
                <th style="text-align: right;">型号</th>
                <th style="text-align: right;">采购价格</th>
                <th style="text-align: right;">数量</th>
                <th style="text-align: right;">备注</th>
            </tr>
            </thead>
            <tbody class="light-text">
            <tr th:each="item : ${data.consumables}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.category}" style="text-align: right;"></td>
                <td th:text="${item.supplier}" style="text-align: right;"></td>
                <td th:text="${item.location}" style="text-align: right;"></td>
                <td th:text="${item.modelNumber}" style="text-align: right;"></td>
                <td th:text="${item.purchaseCost}" style="text-align: right;"></td>
                <td th:text="${item.num}" style="text-align: right;"></td>
                <td th:text="${item.remark}" style="text-align: right;"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <!-- 是否需IT审批 -->
    <div style="padding-left: 23px; font-size: 11px;font-weight: 400;">
        <div style="overflow: hidden;padding-right: 43px;">
            <span style="float: left">是否需IT审批</span>
            <span  style="float: right;font-weight: 700;" class="light-text" th:text="${data.needIT}"></span>
        </div>
        <div style="overflow: hidden; margin-top: 10px;padding-right: 43px;">
            <span style="float: left">是否需打印</span>
            <span style="float: right;font-weight: 700; "  th:text="${data.needPrint}"></span>
        </div>
    </div>

    <div class="flow-chat" style="margin-top: 20px;">
        <div style="font-size: 14px;font-weight: 700; margin-bottom: 22px">审批记录</div>
        <div class="process-line" style="padding-left: 30px;" >

            <div class="process-line__item" th:each="record : ${data.historyRecords}" >
                <div class="title">
                    <div class="info" style="font-size: 11px;font-weight: 400;">
                        <div>
                            <span style="margin-right: 12px;" th:text="${#dates.format(record.endTime, 'yyyy-MM-dd HH:mm:ss')}"></span>
                            <span class="status-tag" style="margin-right: 12px;" th:text="${record.name}"></span>
                            <span class="status-tag" th:text="${record.statusName}"></span>
                        </div>
                        <div style="margin-top: 7px;">
                            <span class="label">处理人：</span>
                            <span class="value" th:text="${record.nickName}"></span>
                        </div>
                        <div class="comment" style="margin-top: 7px;">
                            <span class="label">备注：</span>
                            <span class="value" th:text="${record.comment}"></span>
                        </div>
                    </div>
                </div>
                <div class="circle-container"></div>
                <div class="line"> </div>
            </div>


        </div>
    </div>
    </div>
</body>
</html>

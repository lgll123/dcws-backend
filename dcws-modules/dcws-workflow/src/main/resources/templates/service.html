<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
</head>
<style>
    @page {
      size: A4;          /* 固定为A4尺寸 */
      margin: 20mm;      /* 设置页边距（可选） */
    }

    html,
    body {
      font-family: SourceHanSansCN, Microsoft YaHei, Helvetica Neue, Helvetica, PingFang SC, Arial, "sans-serif";
      color: #000;
      width: 595px;
      margin: 0 auto;
    }
    .basic-info table {
      width: 100%;
      padding-left: 43px;
      margin-top: 10px;
      border-collapse: collapse;
      border: none;
    }
    .basic-info table th,
    .basic-info table td {
      text-align: left;
    }
    .basic-info .light-text td {
      padding: 5px 0 10px 0;
    }
    .title-divider th {
      padding-bottom: 7px;
      border-bottom: 1px solid #000;
    }
    .table-apply-info {
      font-size: 11px;
      font-weight: 400;
    }
    .table-apply-title {
      font-size: 14px;
      font-weight: 700;
      margin-top: 10px;
    }
    .apply-info .light-text td,
    .clear-info .light-text td {
      padding-top: 8px;
    }
    .flow-chat .process-line .process-line__item {
      position: relative;
	  page-break-inside: avoid;  /*防止分页切断 */
      padding-bottom: 25px;
      padding-left: 15px;
      border-left: 2px solid #666;
      z-index: 1;
    }

    .flow-chat .circle-container {
      position: absolute;
      top: 0px;
      left: -4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      z-index: 2;
      background-color: #666;
    }
    .flow-chat .status-tag {
      color: #333;
      background-color: #e9e9e9;
      padding: 2px;
    }
    .flow-chat .process-line .process-line__item:last-child {
      border: none;
    }

    .flow-chat .process-line .process-line__item:not(:first-child) {
      margin-top: -5px;
    }

    .flow-chat .process-line .process-line__item:first-child {
        padding-bottom: 80px;
    }

    .flow-chat .process-line .process-line__item:first-child .title {
      position: absolute;
      top: -5px;
      left: 15px
    }

    .flow-chat .process-line .process-line__item:not(:first-child) .circle-container {
      top: 29px;
    }
    .flow-chat .process-line .process-line__item:last-child .circle-container {
        left: -2px;
    }
</style>
<body>
<!-- pdf头部 -->
<div class="pdf-header" style="overflow: hidden; line-height: 79px;padding-right: 43px;">
    <div class="left" style="float: left">
        <span style="font-size: 25px; margin-right: 16px;font-weight: 700;">服务申请单</span>
        <span style="font-size: 12px;font-weight: 200;" th:text="${data.id}"></span>
    </div>
    <img src="./seal.png" alt="" width="80" style="float: right">
    <!--<img th:src="@{/templates/seal.png}" alt="" width="80">-->
</div>
<!-- 基础信息 -->
<div class="basic-info">
    <div style="font-size: 14px;font-weight: 700;">基础信息</div>
    <div style="padding-left: 43px">
        <table>
            <tr style="font-size: 13px;font-weight: 700;">
                <th style="width: 40%;">申请部门</th>
                <th style="width: 40%;">申请人</th>
                <th style="width: 20%;">申请日期</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;">
                <td th:text="${data.applyDept}" style="width: 40%;"></td>
                <td th:text="${data.applicant}" style="width: 40%;"></td>
                <td th:text="${#dates.format(data.applyDate, 'yyyy-MM-dd')}" style="width: 20%"></td>
            </tr>
            <tr style="font-size: 13px;font-weight: 700;">
                <th>预计使用人</th>
                <th>类型</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;">
                <td th:text="${data.checkTo}"></td>
                <td th:text="${data.applyContentType}"></td>
            </tr>
        </table>
        <div>
            <div style="overflow: hidden;">
                <div style="float: left; margin-right: 15px; display: inline-block; width: 60px;font-size: 13px;font-weight: 700;">申请内容</div>
                <div class="light-text" th:text="${data.applyReson}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></div>
            </div>
            <div style="margin-top: 10px;overflow: hidden;">
                <div style="float: left; margin-right: 15px; display: inline-block; width: 60px;font-size: 13px;font-weight: 700;">备注</div>
                <div class="light-text" th:text="${data.applyRemarks}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></div>
            </div>
        </div>
    </div>
</div>
<!-- 处理内容 -->
<div class="basic-info" style="margin-top: 20px;">
    <div style="font-size: 14px;font-weight: 700;">处理内容</div>
    <div style="padding-left: 43px">
        <div>
            <div style="overflow: hidden;">
                <div style="float: left; margin-right: 15px; display: inline-block; width: 60px;font-size: 13px;font-weight: 700;">类型</div>
                <div class="light-text" th:text="${data.handelContent.categories}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></div>
            </div>
            <div style="margin-top: 10px;overflow: hidden;">
                <div style="float: left; margin-right: 15px; display: inline-block; width: 60px;font-size: 13px;font-weight: 700;">处理方式</div>
                <div class="light-text" th:text="${data.handelContent.handelMethod}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></div>
            </div>
            <div style="margin-top: 10px;overflow: hidden;">
                <div style="float: left; margin-right: 15px; display: inline-block; width: 80px;font-size: 13px;font-weight: 700;">解決方案描述</div>
                <div class="light-text" th:text="${data.handelContent.solutionDesc}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></div>
            </div>
        </div>
        <!--<table>
            <tr style="font-size: 13px;font-weight: 700;">
                <th>类型</th>
                <th>处理方式</th>
                <th>解決方案描述</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;">
                <td th:text="${data.handelContent.categories}"></td>
                <td th:text="${data.handelContent.handelMethod}"></td>
                <td th:text="${data.handelContent.solutionDesc}"></td>
            </tr>
        </table>-->
    </div>
</div>
<!-- 维修信息 -->
<div class="basic-info apply-info" style="margin-top: 20px;" th:if="${data.extMaint != null and not #lists.isEmpty(data.extMaint)}">
    <div  style="font-size: 14px;font-weight: 700;">资产维修信息</div>
    <div style="padding-left: 43px">
        <table class="table-apply-info">
            <thead class="title-divider">
            <tr>
                <th>资产名称</th>
                <th style="text-align: right;">供应商名称</th>
                <th style="text-align: right;">处理人</th>
                <th style="text-align: right;">联系电话</th>
                <th style="text-align: right;">接单日期</th>
                <th style="text-align: right;">维修金额</th>
                <th style="text-align: right;">预计维修时长</th>
                <th style="text-align: right;">处理方案</th>
            </tr>
            </thead>
            <tbody class="light-text">
            <tr th:each="item : ${data.extMaint}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.supplierName}" style="text-align: right;"></td>
                <td th:text="${item.handler}" style="text-align: right;"></td>
                <td th:text="${item.telephone}" style="text-align: right;"></td>
                <td th:text="${item.orderDate}" style="text-align: right;"></td>
                <td th:text="${item.maintAmount}" style="text-align: right;"></td>
                <td th:text="${item.maintDuration}" style="text-align: right;"></td>
                <td th:text="${item.processMethod}" style="text-align: right;"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<!-- 采购详情 -->
<div class="basic-info clear-info" style="margin-top: 20px;" th:if="${data.purchase == '1' }">
    <div  style="font-size: 14px;font-weight: 700;">采购详情</div>
    <div >
        <div style="padding-left: 43px; font-size: 11px;font-weight: 400; margin-top: 20px">
            <div style="overflow: hidden;padding-right: 43px;">
                <span style="float: left">是否需采购</span>
                <span  style="float: right;font-weight: 700;" class="light-text">是</span>
            </div>
            <div style="overflow: hidden; margin-top: 10px;padding-right: 43px;">
                <span style="float: left">采购项目名称</span>
                <span style="float: right;font-weight: 400; "  th:text="${data.projectName}"></span>
            </div>
            <div style="overflow: hidden; margin-top: 10px;padding-right: 43px;">
                <span style="float: left">估算金额</span>
                <span style="float: right;font-weight: 700; "  th:text="${data.purchaseDetail.purchaseAmount}"></span>
            </div>
        </div>
        <!-- 待采购物料 -->
        <div class="table-apply-title" style="padding-left: 23px; margin-top: 16px; margin-bottom: 10px;">待采购物料</div>
        <div style="padding-left: 43px; font-size: 8px;">
            <table class="table-apply-info">
                <thead class="title-divider">
                <tr>
                    <th style="width: 60%;">要求规格</th>
                    <th style="text-align: right;">物料类别</th>
                    <th style="text-align: right;">单位</th>
                    <th style="text-align: right;">数量</th>
                </tr>
                </thead>
                <tbody class="light-text">
                <tr th:each="item : ${data.purchaseDetail.materialInfo}">
                    <td th:text="${item.modelNo}" style="white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></td>
                    <td th:text="${item.name}" style="text-align: right;"></td>
                    <td th:text="${item.unit}" style="text-align: right;"></td>
                    <td th:text="${item.applyNum}" style="text-align: right;"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
        </div>
<div class="flow-chat" style="margin-top: 20px;">
    <div style="font-size: 14px;font-weight: 700; margin-bottom: 22px">审批记录</div>
    <div class="process-line" style="padding-left: 30px;"  >

        <div class="process-line__item" th:each="record : ${data.historyRecords}" >
            <div class="title">
                <div class="info" style="font-size: 11px;font-weight: 400;">
                    <div>
                        <span style="margin-right: 12px;" th:text="${#dates.format(record.endTime, 'yyyy-MM-dd HH:mm:ss')}"></span>
                        <span class="status-tag" style="margin-right: 12px;" th:text="${record.name}"></span>
                        <span class="status-tag" th:text="${record.statusName}"></span>
                    </div>
                    <div style="margin-top: 7px;">
                        <span class="label">处理人：</span>
                        <span class="value" th:text="${record.nickName}"></span>
                    </div>
                    <div class="comment" style="margin-top: 7px;">
                        <span class="label">备注：</span>
                        <span class="value" th:text="${record.comment}"></span>
                    </div>
                </div>
            </div>
            <div class="circle-container"></div>
            <div class="line"> </div>
        </div>


    </div>
</div>
</body>
</html>

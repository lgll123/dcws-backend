<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
</head>
<style>
    @page {
          size: A4;          /* 固定为A4尺寸 */
          margin: 20mm;      /* 设置页边距（可选） */
        }

        html,
        body {
          font-family: SourceHanSansCN, Microsoft YaHei, Helvetica Neue, Helvetica, PingFang SC, Arial, "sans-serif";
          color: #000;
          width: 595px;
          margin: 0 auto;
        }
        .basic-info table {
          width: 100%;
          padding-left: 43px;
          margin-top: 10px;
          border-collapse: collapse;
          border: none;
        }
        .basic-info table th,
        .basic-info table td {
          text-align: left;
        }
        .basic-info .light-text td {
          padding: 5px 0 10px 0;
        }
        .title-divider th {
          padding-bottom: 7px;
          border-bottom: 1px solid #000;
        }
        .table-apply-info {
          font-size: 11px;
          font-weight: 400;
        }
        .table-apply-title {
          font-size: 14px;
          font-weight: 900;
          margin-top: 10px;
        }
        .apply-info .light-text td,
        .clear-info .light-text td {
          padding-top: 8px;
        }
        .flow-chat .process-line .process-line__item {
          position: relative;
          display: block;
          padding-bottom: 20px;
        }

        /* 时间轴容器
        .flow-chat {
            list-style: none;
            padding-left: 0;
        }*/

        .flow-chat .line {
          position: absolute;
          top: 5px;
          left: -15px;
          width: 2px;
          height: 80px;
          background-color: #666;
        }
        .flow-chat .circle-container {
          position: absolute;
          top: 5px;
          left: -14px;
          width: 5px;
          height: 5px;
          border-radius: 50%;
          z-index: 1;
          line-height: 1;
          transform: translate(-50%, -50%);
          background-color: #666;
        }
        .flow-chat .status-tag {
          color: #333;
          background-color: #e9e9e9;
          padding: 2px;
        }
        .flow-chat .process-line .process-line__item:last-child .line {
          height: 0;
        }
</style>
<body>
<!-- pdf头部 -->
<div class="pdf-header" style="overflow: hidden; line-height: 79px;padding-right: 43px;">
    <div class="left" style="float: left">
        <span style="font-size: 25px; margin-right: 16px;font-weight: 900;">资料申请清单</span>
        <span style="font-size: 12px;font-weight: 200;" th:text="${data.id}"></span>
    </div>
    <img src="./seal.png" alt="" width="80" style="float: right">

</div>
<!-- 基础信息 -->
<div class="basic-info">
    <div style="font-size: 14px;font-weight: 900;">基础信息</div>
    <div style="padding-left: 43px">
        <table>
            <tr style="font-size: 13px;font-weight: 900;">
                <th>申请部门</th>
                <th>申请人</th>
                <th>申请日期</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;">
                <td th:text="${data.applyDept}"></td>
                <td th:text="${data.applicant}"></td>
                <td th:text="${#dates.format(data.applyDate, 'yyyy-MM-dd')}"></td>
            </tr>
            <tr style="font-size: 13px;font-weight: 900;">
                <th>资料类型</th>
                <th>使用日期</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;">
                <td th:text="${data.applyDetails.applyContentTypeName}"></td>
                <td th:text="${data.applyDetails.useDate}"></td>
            </tr>
            <tr style="font-size: 13px;font-weight: 900;">
                <th>是否原件</th>
                <th th:if="${data.applyDetails.isOriginal == 1}">归还日期</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;">
                <td th:text="${data.applyDetails.isOriginal == 1 ? '是' : '否'}"></td>
                <td th:if="${data.applyDetails.isOriginal == 1}" th:text="${data.applyDetails.returnDate}"></td>
            </tr>
        </table>
        <div>
            <div style="overflow: hidden;">
                <span style="float: left;margin-right: 15px; display: inline-block; width: 60px;font-size: 13px;font-weight: 700;">申请内容</span><span class="light-text" th:text="${data.applyReson}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></span>
            </div>
            <div style="margin-top: 10px;overflow: hidden;">
                <span style="float: left;margin-right: 15px; display: inline-block; width: 60px;font-size: 13px;font-weight: 700;">备注</span><span class="light-text" th:text="${data.applyRemarks}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></span>
            </div>
        </div>
    </div>
</div>
<!-- 指派信息 -->
<div class="basic-info" style="margin-top: 20px;">
    <div style="font-size: 14px;font-weight: 900;">指派信息</div>
    <div style="padding-left: 43px">
        <table>
            <tr style="font-size: 13px;font-weight: 900;">
                <th>是否指派部门</th>
                <th>指派部门</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;">
                <td th:text="${data.applyDetails.isNeedAssign == 1 ? '是' : '否'}"></td>
                <td th:text="${data.applyDetails.isNeedAssign == 1 ? data.applyDetails.deptName : '无'}"></td>
            </tr>

            <tr style="font-size: 13px;font-weight: 900;" th:if="${data.applyDetails.isOriginal == 1}">
                <th>是否已提供原件</th>
                <th>是否已归还原件</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;" th:if="${data.applyDetails.isOriginal == 1}">
                <td th:text="${data.applyDetails.isProviderOriginal == true ? '是' : '否'}"></td>
                <td th:text="${data.applyDetails.isReturnOriginal == true ? '是' : '否'}"></td>
            </tr>
        </table>
    </div>
</div>
<!-- 审批记录 -->
<div class="flow-chat" style="margin-top: 20px;">
    <div style="font-size: 14px;font-weight: 900; margin-bottom: 12px">审批记录</div>
    <div class="process-line" style="padding-left: 58px;" >

        <div class="process-line__item" th:each="record : ${data.historyRecords}" >
            <div class="title">
                <div class="info" style="font-size: 11px;font-weight: 400;">
                    <div>
                        <span style="margin-right: 12px;" th:text="${#dates.format(record.endTime, 'yyyy-MM-dd HH:mm:ss')}"></span>
                        <span class="status-tag" style="margin-right: 12px;" th:text="${record.name}"></span>
                        <span class="status-tag" th:text="${record.statusName}"></span>
                    </div>
                    <div style="margin-top: 7px;">
                        <span class="label">处理人：</span>
                        <span class="value" th:text="${record.nickName}"></span>
                    </div>
                    <div class="comment" style="margin-top: 7px;">
                        <span class="label">审批意见：</span>
                        <span class="value" th:text="${record.comment}"></span>
                    </div>
                </div>
            </div>
            <div class="circle-container"></div>
            <div class="line"> </div>
        </div>
    </div>
</div>
</body>
</html>

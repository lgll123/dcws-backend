<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
</head>
<style>
    @page {
          size: A4;          /* 固定为A4尺寸 */
          margin: 20mm;      /* 设置页边距（可选） */
        }

        html,
        body {
          font-family: SourceHanSansCN, Microsoft YaHei, Helvetica Neue, Helvetica, PingFang SC, Arial, "sans-serif";
          color: #000;
          width: 595px;
          margin: 0 auto;
        }
        .basic-info table {
          width: 100%;
          padding-left: 43px;
          margin-top: 10px;
          border-collapse: collapse;
          border: none;
        }
        .basic-info table th,
        .basic-info table td {
          text-align: left;
        }
        .basic-info .light-text td {
          padding: 5px 0 10px 0;
        }
        .title-divider th {
          padding-bottom: 7px;
          border-bottom: 1px solid #000;
        }
        .table-apply-info {
          font-size: 11px;
          font-weight: 400;
        }
        .table-apply-title {
          font-size: 14px;
          font-weight: 700;
          margin-top: 10px;
        }
        .apply-info .light-text td,
        .clear-info .light-text td {
          padding-top: 8px;
        }
    .flow-chat .process-line .process-line__item {
      position: relative;
	  page-break-inside: avoid;  /*防止分页切断 */
      padding-bottom: 25px;
      padding-left: 15px;
      border-left: 2px solid #666;
      z-index: 1;
    }

    .flow-chat .circle-container {
      position: absolute;
      top: 0px;
      left: -4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      z-index: 2;
      background-color: #666;
    }
    .flow-chat .status-tag {
      color: #333;
      background-color: #e9e9e9;
      padding: 2px;
    }
    .flow-chat .process-line .process-line__item:last-child {
      border: none;
    }

    .flow-chat .process-line .process-line__item:not(:first-child) {
      margin-top: -5px;
    }

    .flow-chat .process-line .process-line__item:first-child {
        padding-bottom: 80px;
    }

    .flow-chat .process-line .process-line__item:first-child .title {
      position: absolute;
      top: -5px;
      left: 15px
    }

    .flow-chat .process-line .process-line__item:not(:first-child) .circle-container {
      top: 29px;
    }
    .flow-chat .process-line .process-line__item:last-child .circle-container {
        left: -2px;
    }
</style>
<body>
<!-- pdf头部 -->
<div class="pdf-header" style="overflow: hidden; line-height: 79px;padding-right: 43px;">
    <div class="left" style="float: left">
        <span style="font-size: 25px; margin-right: 16px;font-weight: 900;">用印申请清单</span>
        <span style="font-size: 12px;font-weight: 200;" th:text="${data.id}"></span>
    </div>
    <img src="./seal.png" alt="" width="80" style="float: right">

</div>
<!-- 基础信息 -->
<div class="basic-info">
    <div style="font-size: 14px;font-weight: 900;">基础信息</div>
    <div style="padding-left: 43px">
        <table>
            <tr style="font-size: 13px;font-weight: 900;">
                <th>申请部门</th>
                <th>申请人</th>
                <th>申请日期</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;">
                <td th:text="${data.applyDept}"></td>
                <td th:text="${data.applicant}"></td>
                <td th:text="${#dates.format(data.applyDate, 'yyyy-MM-dd')}"></td>
            </tr>
            <tr style="font-size: 13px;font-weight: 900;">
                <th>使用日期</th>
            </tr>
            <tr class="light-text" style="font-size: 11px;font-weight: 400;">
                <td th:text="${#dates.format(data.completeDate, 'yyyy-MM-dd')}"></td>
            </tr>
        </table>
        <div>
            <div style="overflow: hidden;">
                <span style="float: left;margin-right: 15px; display: inline-block; width: 60px;font-size: 13px;font-weight: 700;">用印事由</span><span class="light-text" th:text="${data.applyReson}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></span>
            </div>
            <div style="margin-top: 10px;overflow: hidden;">
                <span style="float: left;margin-right: 15px; display: inline-block; width: 60px;font-size: 13px;font-weight: 700;">备注</span><span class="light-text" th:text="${data.applyRemarks}" style="float: left;font-size: 11px;font-weight: 400;white-space: pre-wrap; word-break: break-all; word-wrap: break-word;"></span>
            </div>
        </div>
    </div>
</div>
<!-- 用印详情 -->
<div class="basic-info apply-info" style="margin-top: 20px;">
    <div style="font-size: 14px;font-weight: 900;">用印详情</div>
    <div style="padding-left: 43px">
        <table class="table-apply-info">
            <thead class="title-divider">
            <tr>
                <th>序号</th>
                <th>印章主体</th>
                <th style="text-align: right;">用印文件</th>
                <th style="text-align: right;">印章名称</th>
                <th style="text-align: right;">份数</th>
                <th style="text-align: right;">用印要求</th>
                <th style="text-align: right;">盖章文件</th>
            </tr>
            </thead>
            <tbody class="light-text">
            <tr th:each="item : ${data.applyDetails}">
                <td th:text="${item.num}"></td>
                <td th:text="${item.companyName}"></td>
                <td style="text-align: right;">
                    <span th:each="file : ${item.sealFile}">
                        <span th:text="${file.fileName}"></span><br>
                    </span>
                </td>
                <td style="text-align: right;">
                    <span th:each="info : ${item.sealInfoList}">
                        <span th:text="${info.sealName}"></span><br>
                    </span>
                </td>
                <td th:text="${item.applyNum}" style="text-align: right;">份</td>
                <td th:text="${item.remark}"></td>
                <td style="text-align: right;">
                    <span th:each="file : ${item.sealFileFinal}">
                        <span th:text="${file.fileName}"></span><br>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<!-- 审批记录 -->
<div class="flow-chat" style="margin-top: 20px;">
    <div style="font-size: 14px;font-weight: 700; margin-bottom: 22px">审批记录</div>
    <div class="process-line" style="padding-left: 30px;" >

        <div class="process-line__item" th:each="record : ${data.historyRecords}" >
            <div class="title">
                <div class="info" style="font-size: 11px;font-weight: 400;">
                    <div>
                        <span style="margin-right: 12px;" th:text="${#dates.format(record.endTime, 'yyyy-MM-dd HH:mm:ss')}"></span>
                        <span class="status-tag" style="margin-right: 12px;" th:text="${record.name}"></span>
                        <span class="status-tag" th:text="${record.statusName}"></span>
                    </div>
                    <div style="margin-top: 7px;">
                        <span class="label">处理人：</span>
                        <span class="value" th:text="${record.nickName}"></span>
                    </div>
                    <div class="comment" style="margin-top: 7px;">
                        <span class="label">备注：</span>
                        <span class="value" th:text="${record.comment}"></span>
                    </div>
                </div>
            </div>
            <div class="circle-container"></div>
            <div class="line"> </div>
        </div>
    </div>
</div>
</body>
</html>

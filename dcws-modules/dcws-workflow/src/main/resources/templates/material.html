<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
  </head>
  <style>
    @page {
      size: A4;          /* 固定为A4尺寸 */
      margin: 20mm;      /* 设置页边距（可选） */
    }

    html,
    body {
      font-family: SourceHanSansCN, Microsoft YaHei, Helvetica Neue, Helvetica, PingFang SC, Arial, "sans-serif";
      color: #000;
      width: 210mm;
      margin: 0 auto;
      padding: 0 36px;
      font-weight: 600;
    }
    .pdf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
    }
    .basic-info table {
      width: 100%;
      font-size: 9px;
      padding-left: 43px;
      margin-top: 10px;
      border-collapse: collapse;
      border: none;
    }
    .basic-info table th,
    .basic-info table td {
      text-align: left;
    }
    .basic-info table .heavy-text th {
      /* font-weight: 500; */
    }
    .basic-info .light-text td {
      padding: 5px 0 10px 0;
      font-weight: 400;
    }
    /*.title-divider {
      border-bottom: 1px solid #000;
    }*/
    .title-divider th {
      /*padding-bottom: 10px;*/
      border-bottom: 1px solid #000;
    }
    .apply-info .light-text td,
    .clear-info .light-text td {
      padding-top: 8px;
    }
    .apply-info table th,
    .clear-info table th {
      font-weight: 400!important;
    }
    .flow-chat .process-line .process-line__item {
      position: relative;
      display: block;
      padding-bottom: 20px;
      font-size: 8px;
      font-weight: 400;
    }

    /* 时间轴容器
    .flow-chat {
        list-style: none;
        padding-left: 0;
    }*/

    .flow-chat .line {
      position: absolute;
      top: 5px;
      left: -15px;
      width: 2px;
      height: 66px;
      background-color: #666;
    }
    .flow-chat .circle-container {
      position: absolute;
      top: 5px;
      left: -14px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      z-index: 1;
      line-height: 1;
      transform: translate(-50%, -50%);
      background-color: #666;
    }
    .flow-chat .status-tag {
      color: #333;
      background-color: #e9e9e9;
      padding: 2px;
    }
    .flow-chat .process-line .process-line__item:last-child .line {
      height: 0;
    }
  </style>
  <body>
    <!-- pdf头部 -->
    <div class="pdf-header" >
      <div class="left">
        <span style="font-size: 18px; margin-right: 16px;">申请物料清单</span>
        <span style="font-size: 9px; " th:text="${data.id}"></span>
      </div>
        <img src="./seal.png" alt="" width="80">
      <!--<img th:src="@{/templates/seal.png}" alt="" width="80">-->
    </div>
    <!-- 基础信息 -->
    <div class="basic-info">
       <div style="font-size: 10px;">基础信息</div>
       <div style="padding-left: 43px">
         <table class="table-right-align">
          <tr class="heavy-text">
              <th>申请部门</th>
              <th>申请人</th>
              <th>申请日期</th>
              <th>当前环节</th>
          </tr>
          <tr class="light-text">
              <td th:text="${data.applyDept}"></td>
              <td th:text="${data.applicant}"></td>
              <td th:text="${#dates.format(data.applyDate, 'yyyy-MM-dd')}"></td>
              <td th:text="${data.status}"></td>
          </tr>
          <tr class="heavy-text">
            <th>需求日期</th>
            <th>预计使用人</th>
          </tr>
          <tr class="light-text">
            <td th:text="${data.requiredDateType}">2025-03-06</td>
            <td th:text="${data.checkTo}">管理员</td>
          </tr>
        </table>
        <div class="table-right-align" style="font-size: 9px;">
          <div>
            <span style="margin-right: 15px; display: inline-block; width: 40px;">申请原因</span><span class="light-text" th:text="${data.applyReson}" style="font-weight: 400;"></span>
          </div>
          <div style="margin-top: 10px;">
            <span style="margin-right: 15px; display: inline-block; width: 40px;">备注</span><span class="light-text" th:text="${data.applyRemarks}" style="font-weight: 400;"></span>
          </div>
        </div>
      </div>
    </div>
    <!-- 申请物料清单 -->
    <div class="basic-info apply-info" style="margin-top: 20px;" th:if="${data.customApplyDetails != null and not #lists.isEmpty(data.customApplyDetails)}">
       <div style="font-size: 10px;">申请物料清单</div>
       <div style="padding-left: 43px">
        <table class="table-right-align" style="font-size: 9px;">
          <thead class="title-divider">
            <tr class="heavy-text">
                <th>规格</th>
                <th style="text-align: right;">类别</th>
                <th style="text-align: right;">单位</th>
                <th style="text-align: right;">数量</th>
            </tr>
          </thead>
          <tbody class="light-text">
            <tr th:each="item : ${data.customApplyDetails}">
              <td th:text="${item.modelNo}"></td>
              <td th:text="${item.name}" style="text-align: right;"></td>
              <td th:text="${item.unit}" style="text-align: right;"></td>
              <td th:text="${item.applyNum}" style="text-align: right;"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- 澄清物料清单 -->
    <div class="basic-info clear-info" style="margin-top: 20px;">
       <div style="font-size: 10px;">澄清物料清单</div>
       <div style="padding-left: 23px; margin-top: 10px; font-size: 10px;">已有物料</div>
       <!-- IT资产清单 -->
       <div style="padding-left: 43px"  th:if="${data.hardware != null and not #lists.isEmpty(data.hardware)}">
        <div style="font-size: 9px; margin-top: 10px;">IT资产清单</div>
        <table class="table-right-align" style="font-size: 9px;">
          <thead class="title-divider">
            <tr class="heavy-text">
                <th>资产名称</th>
                <th style="text-align: right;">资产标签</th>
                <th style="text-align: right;">序列号</th>
                <th style="text-align: right;">型号</th>
                <th style="text-align: right;">类别</th>
            </tr>
          </thead>
          <tbody class="light-text">
            <tr th:each="item : ${data.hardware}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.assetTag}" style="text-align: right;"></td>
                <td th:text="${item.serial}" style="text-align: right;"></td>
                <td th:text="${item.modelNo}" style="text-align: right;"></td>
                <td th:text="${item.categoryName}" style="text-align: right;"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- 许可证清单 -->
       <div style="padding-left: 43px" th:if="${data.licenses != null and not #lists.isEmpty(data.licenses)}">
        <div style="font-size: 9px; margin-top: 10px;">许可证清单</div>
        <table class="table-right-align" style="font-size: 9px;">
          <thead class="title-divider">
            <tr class="heavy-text">
                <th>名称</th>
                <th style="text-align: right;">产品序列号</th>
                <th style="text-align: right;">到期日期</th>
                <th style="text-align: right;">制造商</th>
                <th style="text-align: right;">绑定资产</th>
            </tr>
          </thead>
          <tbody class="light-text">
            <tr th:each="item : ${data.licenses}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.productKey}" style="text-align: right;"></td>
                <td th:text="${item.expirationDate}" style="text-align: right;"></td>
                <td th:text="${item.manufacturerName}" style="text-align: right;"></td>
                <td th:text="${item.asset.name}" style="text-align: right;"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- 附属品清单 -->
       <div style="padding-left: 43px"  th:if="${data.accessories != null and not #lists.isEmpty(data.accessories)}">
        <div style="font-size: 9px; margin-top: 10px;">附属品清单</div>
        <table class="table-right-align" style="font-size: 9px;">
          <thead class="title-divider">
            <tr class="heavy-text">
                <th>名称</th>
                <th style="text-align: right;">配件类别</th>
                <th style="text-align: right;">型号</th>
                <th style="text-align: right;">位置</th>
                <th style="text-align: right;">申请数量</th>
            </tr>
          </thead>
          <tbody class="light-text">
            <tr th:each="item : ${data.accessories}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.categoryName}" style="text-align: right;"></td>
                <td th:text="${item.modelNo}" style="text-align: right;"></td>
                <td th:text="${item.locationName}" style="text-align: right;"></td>
                <td th:text="${item.applyNum}" style="text-align: right;"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- 组件清单 -->
       <div style="padding-left: 43px"  th:if="${data.components != null and not #lists.isEmpty(data.components)}">
        <div style="font-size: 9px; margin-top: 10px;">组件清单</div>
        <table class="table-right-align" style="font-size: 9px;">
          <thead class="title-divider">
            <tr class="heavy-text">
                <th>名称</th>
                <th style="text-align: right;">配件类别</th>
                <th style="text-align: right;">型号</th>
                <th style="text-align: right;">位置</th>
                <th style="text-align: right;">绑定资产</th>
                <th style="text-align: right;">申请数量</th>
            </tr>
          </thead>
          <tbody class="light-text">
            <tr th:each="item : ${data.components}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.categoryName}" style="text-align: right;"></td>
                <td th:text="${item.modelNo}" style="text-align: right;"></td>
                <td th:text="${item.locationName}" style="text-align: right;"></td>
                <td th:text="${item.asset.name}" style="text-align: right;"></td>
                <td th:text="${item.applyNum}" style="text-align: right;"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- 消耗品清单 -->
       <div style="padding-left: 43px"  th:if="${data.consumables != null and not #lists.isEmpty(data.consumables)}">
        <div style="font-size: 9px; margin-top: 10px;">消耗品清单</div>
        <table class="table-right-align" style="font-size: 9px;">
          <thead class="title-divider">
            <tr class="heavy-text">
                <th>名称</th>
                <th style="text-align: right;">配件类别</th>
                <th style="text-align: right;">型号</th>
                <th style="text-align: right;">位置</th>
                <th style="text-align: right;">申请数量</th>
            </tr>
          </thead>
          <tbody class="light-text">
            <tr th:each="item : ${data.consumables}">
              <td th:text="${item.name}"></td>
              <td th:text="${item.categoryName}" style="text-align: right;"></td>
              <td th:text="${item.modelNo}" style="text-align: right;"></td>
              <td th:text="${item.locationName}" style="text-align: right;"></td>
              <td th:text="${item.applyNum}" style="text-align: right;"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- 是否需采购 -->
        <div  th:if="${data.purchaseDetail.materialInfo != null and not #lists.isEmpty(data.purchaseDetail.materialInfo)}">
      <div style="padding-left: 23px; margin-top: 16px; margin-bottom: 10px; font-size: 10px;">是否需采购</div>
      <div style="padding-left: 43px; font-size: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>澄清库存</span>
          <span  style="text-align: right; margin: 5px 0; flex-grow: 1;" class="light-text" th:text="${data.purchase}"></span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 10px;">
          <span>采购金额</span>
          <span style="text-align: right; margin: 5px 0; flex-grow: 1;"  th:text="${data.purchaseDetail.purchaseAmount}"></span>
        </div>
      </div>
      <!-- 待采购物料 -->
      <div style="padding-left: 23px; margin-top: 16px; margin-bottom: 10px; font-size: 10px;">待采购物料</div>
      <div style="padding-left: 43px; font-size: 8px;">
        <table class="table-right-align" style="font-size: 9px;">
          <thead class="title-divider">
            <tr class="heavy-text">
                <th>规格</th>
                <th style="text-align: right;">类别</th>
                <th style="text-align: right;">单位</th>
                <th style="text-align: right;">数量</th>
            </tr>
          </thead>
          <tbody class="light-text">
            <tr th:each="item : ${data.purchaseDetail.materialInfo}">
              <td th:text="${item.modelNo}"></td>
              <td th:text="${item.name}" style="text-align: right;"></td>
              <td th:text="${item.unit}" style="text-align: right;"></td>
              <td th:text="${item.applyNum}" style="text-align: right;"></td>
            </tr>
          </tbody>
        </table>
    </div>
        </div>
    <div class="flow-chat" style="margin-top: 20px;">
      <div style="font-size: 10px; margin-bottom: 12px">审批记录</div>
      <div class="process-line" style="padding-left: 58px;"  >

        <div class="process-line__item" th:each="record : ${data.historyRecords}" >
          <div class="title">
            <div class="info">
              <div>
                <span style="font-size: 9px; margin-right: 12px;" th:text="${#dates.format(record.endTime, 'yyyy-MM-dd HH:mm:ss')}"></span>
                <span class="status-tag" style="margin-right: 12px;" th:text="${record.name}"></span>
                <span class="status-tag" th:text="${record.statusName}"></span>
              </div>
              <div style="margin-top: 7px;">
                <span class="label">处理人：</span>
                <span class="value" th:text="${record.nickName}"></span>
              </div>
              <div class="comment" style="margin-top: 7px;">
                <span class="label">审批意见：</span>
                <span class="value" th:text="${record.comment}"></span>
              </div>
            </div>
          </div>
          <div class="circle-container"></div>
          <div class="line"> </div>
        </div>


      </div>
    </div>
  </body>
</html>
